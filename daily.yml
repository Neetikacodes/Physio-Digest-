name: Daily physio digest
on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST every day
  workflow_dispatch:        # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch today's study
        env:
          ENTRIES_PER_DAY: "3"   # change to 2, 4... as you like
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_daily.py
      - name: Commit changes
        run: |
          git config user.name "physio-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/entries.json
          git diff --cached --quiet || (git commit -m "Add daily entry" && git push)
