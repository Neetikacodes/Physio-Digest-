<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physio Digest — Daily physiotherapy research, explained simply</title>
<meta name="description" content="New physiotherapy and rehabilitation studies every day, across specializations, sourced from PubMed and explained in plain language (English and Hindi).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf3f3; --surface:#f8fbfb; --ink:#13262b; --muted:#53686d; --line:#c5d4d6;
  --accent:#0b7a83; --accent-ink:#ffffff; --mark:#e9b44c; --mark-ink:#3a2a05;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1a1d; --surface:#142428; --ink:#e4efef; --muted:#93acb0; --line:#2b464c; --accent:#4cc3cc; --accent-ink:#06191c; --mark:#d9a23f; --mark-ink:#1f1503}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Public Sans","Noto Sans Devanagari",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header{padding:56px 0 28px}
h1{font:700 clamp(2.4rem,7vw,3.8rem)/1 "Bricolage Grotesque","Noto Sans Devanagari",sans-serif;letter-spacing:-.02em;margin:0 0 14px}
.lede{max-width:52ch;color:var(--muted);margin:0 0 24px;font-size:1.05rem}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.9rem;border:0;background:none;color:var(--ink);padding:7px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=search]{font:inherit;font-size:.95rem;flex:1 1 200px;min-width:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{font:inherit;font-size:.85rem;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.count{color:var(--muted);font-size:.9rem;margin:6px 0 0}

/* the log: a vertical rail, one node per day */
main{padding-bottom:64px}
.day{position:relative;padding:0 0 34px 34px}
.day::before{content:"";position:absolute;left:7px;top:10px;bottom:-4px;width:2px;background:var(--line)}
.day:last-child::before{bottom:34px}
.day::after{content:"";position:absolute;left:0;top:6px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.date{font:600 .95rem "Bricolage Grotesque","Noto Sans Devanagari",sans-serif;color:var(--muted);margin:0 0 10px}
article{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;font-size:.8rem}
.tag{padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.spec{border-color:var(--accent);color:var(--accent);font-weight:600}
.tag.type{background:var(--mark);color:var(--mark-ink);border-color:var(--mark);font-weight:600}
h2{font:700 1.3rem/1.25 "Bricolage Grotesque","Noto Sans Devanagari",sans-serif;margin:0 0 10px;letter-spacing:-.01em}
h2 a{color:inherit;text-decoration:none}
h2 a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
article p{margin:0 0 12px;max-width:68ch}
.takeaway{border-left:3px solid var(--accent);padding-left:14px}
.takeaway b{display:block;font-size:.85rem;color:var(--accent);margin-bottom:2px}
.src{font-size:.85rem;color:var(--muted);margin:0}
.src a{color:var(--accent)}
.note{font-size:.8rem;color:var(--muted)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:.85rem}
@media (max-width:520px){article{padding:16px}.day{padding-left:28px}}
@media (prefers-reduced-motion:no-preference){.day:first-child::after{animation:pulse 2.4s ease-out 1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 14px transparent}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Physio Digest</h1>
    <p class="lede" id="t-lede"></p>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button id="b-en" aria-pressed="true">English</button>
        <button id="b-hi" aria-pressed="false">हिन्दी</button>
      </div>
      <input type="search" id="q" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
    <p class="count" id="count" aria-live="polite"></p>
  </header>
  <main id="log"><div class="empty">…</div></main>
  <footer id="foot"></footer>
</div>

<script>
const UI = {
  en:{lede:"New physiotherapy and rehabilitation studies every day, across specializations, pulled from PubMed and explained in plain language.",
      search:"Search title or specialization", all:"All", takeaway:"What it means in practice", read:"Read on PubMed",
      empty:"No entries yet. The first study appears after the next daily update.", none:"Nothing matches your search.",
      n:(x)=>x+(x===1?" study":" studies"), nohi:"Hindi summary not available for this entry; showing English.",
      foot:"For learning only. This is not medical advice; check the original paper and talk to a qualified clinician before changing treatment.",
      loadfail:"Could not load the log. Try refreshing the page."},
  hi:{lede:"हर दिन अलग-अलग स्पेशलाइज़ेशन की नई फिज़ियोथेरेपी रिसर्च, PubMed से ली गई और आसान भाषा में समझाई गई।",
      search:"टाइटल या स्पेशलाइज़ेशन खोजें", all:"सभी", takeaway:"प्रैक्टिस में इसका मतलब", read:"PubMed पर पढ़ें",
      empty:"अभी कोई एंट्री नहीं है। अगले डेली अपडेट के बाद पहली स्टडी दिखेगी।", none:"आपकी खोज से कुछ नहीं मिला।",
      n:(x)=>x+" स्टडी", nohi:"इस एंट्री की हिंदी समरी उपलब्ध नहीं है; अंग्रेज़ी दिखाई जा रही है।",
      foot:"सिर्फ़ सीखने के लिए। यह मेडिकल सलाह नहीं है; इलाज में बदलाव से पहले मूल पेपर देखें और योग्य क्लिनिशियन से बात करें।",
      loadfail:"लॉग लोड नहीं हो सका। पेज रीफ़्रेश करके देखें।"}
};
let lang = (navigator.language || "").startsWith("hi") ? "hi" : "en";
try { const s = localStorage.getItem("pd-lang"); if (s === "en" || s === "hi") lang = s; } catch(e){}
const SPEC_HI = {"Orthopaedic":"ऑर्थोपेडिक","Neurological":"न्यूरोलॉजिकल","Sports":"स्पोर्ट्स","Cardiopulmonary":"कार्डियोपल्मोनरी","Paediatric":"पीडियाट्रिक","Geriatric":"जेरियाट्रिक","Women's health":"महिला स्वास्थ्य","Pain":"दर्द","General":"सामान्य"};
const specLabel = x => lang === "hi" ? (SPEC_HI[x] || x) : x;
let topic = "", query = "", entries = [];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function pick(obj){ // returns [text, fellBackToEnglish]
  if (!obj) return ["", false];
  if (lang === "hi") return obj.hi ? [obj.hi, false] : [obj.en || "", !!obj.en];
  return [obj.en || "", false];
}

function render(){
  const t = UI[lang];
  document.documentElement.lang = lang;
  $("t-lede").textContent = t.lede;
  $("q").placeholder = t.search;
  $("foot").textContent = t.foot;
  $("b-en").setAttribute("aria-pressed", lang==="en");
  $("b-hi").setAttribute("aria-pressed", lang==="hi");

  const topics = [...new Set(entries.map(e=>e.topic).filter(Boolean))].sort();
  $("chips").innerHTML = entries.length ? [`<button class="chip" data-t="" aria-pressed="${topic===""}">${t.all}</button>`]
    .concat(topics.map(x=>`<button class="chip" data-t="${esc(x)}" aria-pressed="${topic===x}">${esc(specLabel(x))}</button>`)).join("") : "";

  const q = query.trim().toLowerCase();
  const list = entries.filter(e => (!topic || e.topic===topic) &&
    (!q || (e.title+" "+(e.topic||"")+" "+(SPEC_HI[e.topic]||"")+" "+(e.summary?.en||"")+" "+(e.summary?.hi||"")).toLowerCase().includes(q)));

  $("count").textContent = entries.length ? t.n(list.length) : "";
  if (!list.length){ $("log").innerHTML = `<div class="empty">${entries.length ? t.none : t.empty}</div>`; return; }

  const byDay = {};
  list.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
  $("log").innerHTML = Object.keys(byDay).sort().reverse().map(d => {
    const label = new Date(d+"T00:00:00").toLocaleDateString(lang==="hi"?"hi-IN":"en-IN",{day:"numeric",month:"long",year:"numeric"});
    return `<section class="day"><p class="date">${esc(label)}</p>` + byDay[d].map(e => {
      const [sum, fb1] = pick(e.summary), [tk, fb2] = pick(e.takeaway);
      return `<article>
        <div class="tags">${e.topic?`<span class="tag spec">${esc(specLabel(e.topic))}</span>`:""}${e.study_type?`<span class="tag type">${esc(e.study_type)}</span>`:""}</div>
        <h2><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></h2>
        <p>${esc(sum)}</p>
        ${tk?`<p class="takeaway"><b>${t.takeaway}</b>${esc(tk)}</p>`:""}
        ${(fb1||fb2)?`<p class="note">${t.nohi}</p>`:""}
        <p class="src">${esc(e.journal)}${e.year?", "+esc(e.year):""}. <a href="${esc(e.url)}" target="_blank" rel="noopener">${t.read}</a></p>
      </article>`;
    }).join("") + `</section>`;
  }).join("");
}

$("b-en").onclick = () => setLang("en");
$("b-hi").onclick = () => setLang("hi");
function setLang(l){ lang = l; try{localStorage.setItem("pd-lang", l)}catch(e){} render(); }
$("q").addEventListener("input", e => { query = e.target.value; render(); });
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if(!b) return; topic = b.dataset.t; render(); });

render();
fetch("data/entries.json", {cache:"no-store"})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => { entries = Array.isArray(d) ? d : []; render(); })
  .catch(() => { $("log").innerHTML = `<div class="empty">${UI[lang].loadfail}</div>`; });
</script>
</body>
</html>
